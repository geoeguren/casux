name: refresh wfs/rest snapshots

on:
  schedule:
    - cron: '0 3 1 * *'   # 1ro de cada mes, 3am UTC
  workflow_dispatch:        # también disparo manual desde GitHub

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install @aws-sdk/client-s3 @turf/simplify dotenv

      - name: Generar snapshots
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET:   ${{ secrets.R2_BUCKET }}
          R2_KEY_ID:   ${{ secrets.R2_KEY_ID }}
          R2_APP_KEY:  ${{ secrets.R2_APP_KEY }}
          R2_REGION:   auto
        run: node scripts/generate-snapshots.js --force
