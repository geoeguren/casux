<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casux</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <meta property="og:title"       content="Casux — Escribí lo que querés. Casux lo mapea."/>
  <meta property="og:description" content="Tu próximo mapa empieza con una frase."/>
  <meta property="og:image"       content="https://casux.vercel.app/og-image.png"/>
  <meta property="og:url"         content="https://casux.vercel.app/chat"/>
  <meta property="og:type"        content="website"/>
  <meta name="twitter:card"        content="summary_large_image"/>
  <meta name="twitter:title"       content="Casux — Escribí lo que querés. Casux lo mapea."/>
  <meta name="twitter:description" content="Tu próximo mapa empieza con una frase."/>
  <meta name="twitter:image"       content="https://casux.vercel.app/og-image.png"/>

  <!-- Tema: aplicar ANTES del primer paint para evitar destello noche→día -->
  <script>
    (function() {
      try {
        const saved = localStorage.getItem('sm_theme');
        const auto  = (new Date().getHours() >= 7 && new Date().getHours() < 20) ? 'day' : 'night';
        const theme = saved || auto;
        if (theme === 'day') document.documentElement.classList.add('day');
      } catch(e) {}
    })();
  </script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Turf.js — defer: solo se necesita si el fallback al cliente se activa    -->
  <!-- SRI: agregar integrity="sha384-<hash>" crossorigin="anonymous" antes     -->
  <!-- de deployar a producción. Obtener hash con:                              -->
  <!--   curl -s https://unpkg.com/@turf/turf@6.5.0/turf.min.js |              -->
  <!--     openssl dgst -sha384 -binary | openssl base64 -A                     -->
  <script defer src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

  <link rel="stylesheet" href="../style/base.css" />
  <link rel="stylesheet" href="../style/home.css" />
  <link rel="stylesheet" href="../style/sidebar.css" />
  <link rel="stylesheet" href="../style/chat.css" />
  <link rel="stylesheet" href="../style/map.css" />
  <link rel="stylesheet" href="../style/modals.css" />
</head>
<body>

  <!-- ===== PANTALLA HOME ===== -->
  <div id="screen-home" class="screen active">
    <!-- Sidebar en home -->
    <div class="sidebar sidebar-home" id="sidebar-home"></div>
    <main class="home-main">

      <h1 class="home-greeting" id="home-greeting"></h1>

      <div class="prompt-box" id="prompt-box">
        <textarea
          id="initial-prompt"
          class="prompt-textarea"
          placeholder="" data-i18n-placeholder="home_placeholder"
          rows="1"
        ></textarea>
        <button class="prompt-send" id="btn-send-initial">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>

      <div id="home-suggested-prompts"></div>

    </main>
  </div>

  <!-- ===== PANTALLA DE TRABAJO ===== -->
  <div id="screen-work" class="screen">

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar"></div>

    <!-- Panel izquierdo: chat -->
    <aside class="chat-panel" id="chat-panel">
      <!-- Barra de título del chat -->
      <div class="chat-header-bar" id="chat-header-bar" style="display:none">
        <div class="chat-header-inner">
          <input type="text" class="chat-header-title-input" id="chat-header-title"
                 placeholder="Sin título" autocomplete="off" />
        </div>
        <button class="chat-header-delete-btn" id="chat-header-delete-btn" data-tooltip="" data-i18n-tooltip="chat_delete">
          <span class="material-icons">delete</span>
        </button>
      </div>

      <div class="chat-messages" id="chat-messages"></div>
      <button class="btn-scroll-bottom" id="btn-scroll-bottom" >
        <span class="material-icons">south</span>
      </button>
      <div class="chat-input-area">
        <div class="prompt-box compact">
          <textarea
            id="chat-input"
            class="prompt-textarea"
            placeholder="" data-i18n-placeholder="chat_placeholder"
            rows="1"
          ></textarea>
          <button class="prompt-send" id="btn-send-chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
          </button>
          <button class="prompt-stop hidden" id="btn-stop-chat" aria-label="Detener">
            <span class="material-icons">stop</span>
          </button>
        </div>
      </div>
      <p class="chat-legend" data-i18n="chat_disclaimer"></p>
    </aside>

    <!-- Divisor redimensionable -->
    <div class="resize-divider" id="resize-divider"></div>

    <!-- Panel derecho: visor de mapa -->
    <section class="map-panel" id="map-panel" style="display:none">

      <div class="map-topbar" id="map-topbar">
        <input
          type="text"
          id="map-title"
          class="map-title-input"
          value="Mi mapa"
          placeholder="" data-i18n-placeholder="map_title_placeholder"
        />
        <div class="map-topbar-actions">
          <div class="export-wrapper">
            <button class="btn-export-text" id="btn-export" >
              <span data-i18n="export_btn_label">EXPORTAR</span> <span class="material-icons">expand_more</span>
            </button>
            <div class="export-dropdown" id="export-dropdown">
              <button class="export-option" id="export-graphic">
                <span class="export-opt-label" data-i18n="export_opt_graphic">Salida gráfica</span>
                <span class="export-opt-hint" data-i18n="export_hint_graphic">jpeg · pdf</span>
              </button>
              <button class="export-option" id="export-html">
                <span class="export-opt-label" data-i18n="export_opt_html">Embebido</span>
                <span class="export-opt-hint" data-i18n="export_hint_html">html</span>
              </button>
              <button class="export-option" id="export-geojson">
                <span class="export-opt-label" data-i18n="export_opt_geojson">Capa vectorial</span>
                <span class="export-opt-hint" data-i18n="export_hint_geojson">geojson</span>
              </button>
            </div>
          </div>
          <button class="btn-icon btn-map-action" id="btn-refresh-map" data-tooltip="" data-i18n-tooltip="tooltip_refresh">
            <span class="material-icons">refresh</span>
          </button>
          <button class="btn-icon btn-map-action" id="btn-close-map" data-tooltip="" data-i18n-tooltip="tooltip_back_chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="map-progress" id="map-progress"><div class="map-progress-bar" id="map-progress-bar"></div></div>

      <div id="map-container">
        <div id="leaflet-map"></div>

        <!-- Controles izquierda -->
        <div class="map-controls map-controls-left">
          <button class="map-ctrl-btn" id="btn-zoom-in"    ><span class="material-icons">add</span></button>
          <button class="map-ctrl-btn" id="btn-zoom-reset" data-tooltip="" data-i18n-tooltip="map_zoom_reset"><span class="material-icons">undo</span></button>
          <button class="map-ctrl-btn" id="btn-zoom-out"   ><span class="material-icons">remove</span></button>
        </div>

        <!-- Controles derecha -->
        <div class="map-controls map-controls-right">
          <button class="map-ctrl-btn" id="btn-map-layers" data-tooltip="" data-i18n-tooltip="map_layers" style="display:none">
            <span class="material-icons">layers</span>
          </button>
          <!-- ETIQUETAS: botón inhabilitado — funcionalidad pendiente para siguiente etapa.
               Ver roadmap: "Etiquetas sobre features (labels)".
               Al implementar: quitar disabled y style de opacidad, conectar al módulo de labels. -->
          <!-- TODO(labels): Botón de etiquetas sobre el mapa — habilitarlo cuando se implemente setLabels() en map.js -->
          <button class="map-ctrl-btn" id="btn-labels" data-tooltip="" data-i18n-tooltip="map_labels" disabled
            style="display:none;opacity:0.35;cursor:not-allowed" aria-disabled="true">
            <span class="material-icons">label</span>
          </button>
          <button class="map-ctrl-btn" id="btn-identify" data-tooltip="" data-i18n-tooltip="map_identify" style="display:none">
            <span class="material-icons">question_mark</span>
          </button>
        </div>

        <div class="map-empty hidden" id="map-empty">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" width="44" height="44" opacity="0.2">
            <path d="M42 6L22 12L6 6v44l16 6 20-6 16 6V12L58 6z"/>
            <line x1="22" y1="12" x2="22" y2="56"/>
            <line x1="42" y1="6" x2="42" y2="50"/>
          </svg>
          <p>El mapa aparecerá aquí</p>
        </div>
        <div class="map-legend" id="map-legend"></div>
      </div>

    </section>

    <!-- Editor de estilos -->
  </div>

  <!-- Modal de búsqueda -->
  <div class="search-modal-backdrop" id="search-backdrop"></div>
  <div class="search-modal" id="search-modal">
    <div class="search-modal-input-row">
      <span class="material-icons search-modal-icon">search</span>
      <input type="text" id="search-input" class="search-modal-input" placeholder="" data-i18n-placeholder="search_placeholder" autocomplete="off" />
      <button class="search-modal-close" id="search-close">
        <span class="material-icons">close</span>
      </button>
    </div>
    <div class="search-modal-results" id="search-results"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- ── Librerías externas ──────────────────────────────────────── -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>

  <!-- ── i18n — cargar antes que cualquier otro módulo ───────────── -->
  <script src="../i18n/es.js"></script>
  <script src="../i18n/en.js"></script>
  <script src="../i18n/pt.js"></script>
  <script src="../i18n/i18n.js"></script>   <!-- window.I18N, window.t -->
  <script src="../src/tooltip.js"></script>  <!-- window.TOOLTIP — tooltips globales -->

  <!-- ── Módulos de datos y capas ────────────────────────────────── -->
  <script src="../src/palettes.js"></script>               <!-- window.PALETTES, window.PALETTE_LABELS -->
  <script src="../src/maki-icons.js"></script>             <!-- window.MAKI_ICONS — catálogo de íconos Maki -->
  <script src="../layers/sources.js"></script>             <!-- window.SOURCES  — registro de fuentes  -->

  <!-- ── Módulos de red / geo ─────────────────────────────────────── -->
  <script src="../src/wfs.js"></script>              <!-- window.WFS              — fetch WFS con caché         -->
  <script src="../src/rest.js"></script>             <!-- window.REST             — fetch ArcGIS REST con caché -->
  <script src="../src/utils.js"></script>            <!-- window.UTILS            — utilidades compartidas         -->
  <script src="../src/spatial-utils.js"></script>     <!-- window._SPATIAL_UTILS     — utilidades espaciales compartidas                   -->
  <script src="../src/spatial-clip.js"></script>      <!-- window._SPATIAL_CLIP      — recorte geométrico (clip / clip_exclude)           -->

  <script src="../src/spatial-within_layer.js"></script> <!-- window._SPATIAL_WITHIN_LAYER — dentro de distancia (within_layer / exclude) -->
  <script src="../src/spatial-adjacent.js"></script>    <!-- window._SPATIAL_ADJACENT    — adyacencia espacial (adjacent / adjacent_exclude)   -->
  <script src="../src/spatial-nearest.js"></script>     <!-- window._SPATIAL_NEAREST     — los N más cercanos/lejanos (nearest / exclude)        -->
  <script src="../src/spatial.js"></script>          <!-- window.SPATIAL          — orquestador espacial        -->

  <!-- ── Módulos de mapa ──────────────────────────────────────────── -->
  <script src="../src/map.js"></script>       <!-- window.MAP   — Leaflet                 -->
  <script src="../src/export-utils.js"></script>    <!-- window.EXPORT_UTILS — utilidades compartidas   -->
  <script src="../src/export-geojson.js"></script>  <!-- window.EXPORT_GEOJSON                           -->
  <script src="../src/export-canvas.js"></script>   <!-- window.EXPORT_CANVAS — canvas JPEG              -->
  <script src="../src/export-jpeg.js"></script>     <!-- window.EXPORT_JPEG                              -->
  <script src="../src/export-pdf.js"></script>      <!-- window.EXPORT_PDF                               -->
  <script src="../src/export-html.js"></script>     <!-- window.EXPORT_HTML                              -->
  <script src="../src/export-graphic.js"></script>  <!-- window.EXPORT_GRAPHIC — modal salida gráfica    -->
  <script src="../src/export.js"></script>          <!-- window.EXPORT — punto de entrada                -->

  <script src="../src/intent-utils.js"></script>     <!-- window.INTENT_UTILS    — normalización, tokenización, stopwords  -->
  <script src="../src/intent-scorer.js"></script>    <!-- window.INTENT_SCORER   — TF-IDF, IDF, detectarArea, desempate   -->
  <script src="../src/intent-capa.js"></script>      <!-- window.INTENT_CAPA     — detectarCapa, construirInstruccion      -->
  <script src="../src/intent-verbos.js"></script>    <!-- window.INTENT_VERBOS   — vocabulario de verbos trilingüe         -->
  <script src="../src/intent-objeto.js"></script>    <!-- window.INTENT_OBJETO   — clasificador de objeto                  -->
  <script src="../src/intent-tabla.js"></script>     <!-- window.INTENT_TABLA    — tabla declarativa Verbo × Objeto        -->
  <script src="../src/intent-validar.js"></script>   <!-- window.INTENT_VALIDAR  — validaciones y restricciones            -->
  <script src="../src/intent-resolver.js"></script>  <!-- window.INTENT_RESOLVER — orquestador principal                   -->
  <script src="../src/intent-index.js"></script>     <!-- window.INTENT          — API pública                             -->
  <script src="../src/chat.js"></script>      <!-- window.CHAT, window.UI                 -->
  <script src="../src/settings.js"></script>  <!-- window.SETTINGS                        -->
  <script src="../src/auth.js"></script>      <!-- window.AUTH                            -->
  <script src="../src/db-client.js"></script> <!-- window.FB                              -->
  <script src="../src/analytics.js"></script> <!-- window.ANALYTICS                       -->
  <script src="../src/suggested-prompts.js"></script> <!-- window.SUGGESTED_PROMPTS        -->
  <script src="../src/sidebar.js"></script>   <!-- window.SIDEBAR                         -->
  <script src="../src/search.js"></script>    <!-- window.SEARCH                          -->
  <script src="../src/chat-header.js"></script>  <!-- window.CHAT_HEADER                  -->
  <script src="../src/map-controls.js"></script> <!-- window.MAP_CONTROLS                 -->
  <script src="../src/layers-panel-utils.js"></script>  <!-- window.LP_UTILS  — helpers compartidos     -->
  <script src="../src/layers-panel-style.js"></script>  <!-- window.LP_STYLE  — acordeón y estilos      -->
  <script src="../src/layers-panel-modal.js"></script>  <!-- window.LP_MODAL  — modal avanzado           -->
  <script src="../src/layers-panel.js"></script>        <!-- window.LP_PANEL, window.LAYERS_PANEL        -->

  <!-- ── Orquestador principal (debe ir último) ───────────────────── -->
  <script src="../src/app.js"></script>       <!-- window.APP, window.TOAST, window.THEME -->

  <!-- ── Verificación de módulos en desarrollo ────────────────────── -->
  <!-- Espera el evento layers:ready (disparado por layers/index.js)   -->
  <!-- para asegurar que window.LAYERS ya está disponible al chequear. -->
  <script>
    window.addEventListener('layers:ready', function checkModules() {
      const required = [
        'I18N',
        'UTILS',
        'PALETTES', 'LAYERS', 'SOURCES',
        'WFS', 'SPATIAL',
        'MAP', 'EXPORT', 'EXPORT_GRAPHIC',
        'CHAT', 'UI', 'SETTINGS', 'AUTH', 'FB',
        'SIDEBAR', 'SEARCH', 'CHAT_HEADER', 'MAP_CONTROLS',
        'LP_UTILS', 'LP_STYLE', 'LP_MODAL', 'LP_PANEL', 'LAYERS_PANEL',
        'APP', 'TOAST', 'THEME'
      ];
      const missing = required.filter(m => !window[m]);
      if (missing.length) {
        console.error('[Casux] Módulos no cargados:', missing.join(', '));
      }
    }, { once: true });
  </script>


</body>
</html>

  <!-- ═══════════════════════════════════════════════════════════════
       TEST RUNNER — solo activo con ?test=true en la URL
       No afecta en nada al funcionamiento normal de la app.
       Uso: https://dominio.com/chat?test=true
  ═══════════════════════════════════════════════════════════════ -->
  <script>
  (function() {
    if (!new URLSearchParams(location.search).has('test')) return;

    // Montar overlay de UI del runner
    const overlay = document.createElement('div');
    overlay.id = '__test_overlay';
    overlay.style.cssText = [
      'position:fixed','inset:0','z-index:99999',
      'background:#0f0f10','color:#d4d4d4',
      'font-family:system-ui,sans-serif','font-size:13px',
      'display:flex','flex-direction:column','overflow:hidden',
    ].join(';');

    overlay.innerHTML = `
<style>
  #__tr { display:flex; flex-direction:column; height:100%; }
  #__tr-top { display:flex; align-items:center; gap:10px; padding:10px 16px;
               border-bottom:1px solid #222; background:#111; flex-shrink:0; }
  #__tr-top h1 { font-size:14px; font-weight:600; color:#fff; margin:0; flex:1; }
  #__tr-top button { padding:5px 12px; border-radius:4px; border:1px solid #333;
                     background:#1c1c1e; color:#d4d4d4; cursor:pointer;
                     font-size:11px; font-family:inherit; }
  #__tr-top button.pri { background:#2563eb; border-color:#2563eb; color:#fff; }
  #__tr-stat { display:flex; gap:20px; padding:8px 16px; background:#111;
               border-bottom:1px solid #1a1a1a; flex-shrink:0; font-size:12px; }
  .st-n { color:#888; } .st-p { color:#22c55e; } .st-f { color:#ef4444; } .st-t { color:#aaa; }
  #__tr-prog { height:2px; background:#1a1a1a; flex-shrink:0; }
  #__tr-prog-bar { height:100%; width:0; background:#22c55e; transition:width .08s; }
  #__tr-filter { display:flex; gap:5px; flex-wrap:wrap; padding:6px 14px;
                 border-bottom:1px solid #1a1a1a; flex-shrink:0; }
  .sf { padding:2px 8px; border-radius:10px; border:1px solid #2a2a2e;
        background:#1c1c1e; color:#888; cursor:pointer; font-size:10px; }
  .sf.on { border-color:#444; color:#ccc; background:#2a2a2e; }
  #__tr-body { flex:1; overflow-y:auto; }
  .su { border-bottom:1px solid #1a1a1a; }
  .su-h { display:flex; gap:8px; align-items:center; padding:7px 14px;
           cursor:pointer; background:#111; user-select:none; }
  .su-h:hover { background:#161618; }
  .su-title { font-weight:600; color:#e0e0e0; flex:1; font-size:12px; }
  .su-stats { font-size:10px; }
  .su-arr { font-size:9px; color:#555; transition:transform .12s; }
  .su.col .su-arr { transform:rotate(-90deg); }
  .su.col .su-rows { display:none; }
  .tr { display:flex; gap:7px; padding:5px 14px 5px 28px; border-bottom:1px solid #161616;
        align-items:flex-start; }
  .tr.fail { background:rgba(239,68,68,.05); }
  .tr .ic { font-size:11px; margin-top:1px; width:12px; flex-shrink:0; }
  .tr.pass .ic { color:#22c55e; } .tr.fail .ic { color:#ef4444; } .tr.skip .ic { color:#666; }
  .tr-desc { color:#bbb; font-size:12px; line-height:1.4; }
  .tr-err { color:#f87171; font-size:10px; margin-top:3px; font-family:monospace;
             background:rgba(239,68,68,.07); padding:3px 7px; border-radius:3px;
             border-left:2px solid #ef4444; white-space:pre-wrap; word-break:break-word; }
  #__tr-close { position:fixed; top:10px; right:14px; z-index:100000;
                background:#222; border:1px solid #333; color:#aaa; border-radius:4px;
                padding:3px 8px; cursor:pointer; font-size:12px; font-family:inherit; }
</style>
<button id="__tr-close" onclick="document.getElementById('__test_overlay').remove()">✕ cerrar</button>
<div id="__tr">
  <div id="__tr-top">
    <h1>🧪 Intent Tests</h1>
    <button class="pri" id="__tr-run-all">▶ Correr todos</button>
    <button id="__tr-run-sel">▶ Seleccionados</button>
    <button onclick="document.querySelectorAll('.su').forEach(s=>s.classList.remove('col'))">Expandir</button>
    <button onclick="document.querySelectorAll('.su').forEach(s=>s.classList.add('col'))">Colapsar</button>

  </div>

  <div id="__tr-prog"><div id="__tr-prog-bar"></div></div>

  <div id="__tr-body"></div>

    document.body.appendChild(overlay);

    // Cargar intent-tests.js — esperar a layers:ready para que LAYERS esté disponible
    function mountRunner() {
      const sc = document.createElement('script');
      sc.src = '../src/intent-tests.js';
      sc.onload = initRunner;
      sc.onerror = () => {
        document.getElementById('__tr-body').innerHTML =
          '<div style="padding:20px;color:#ef4444">Error cargando src/intent-tests.js — verificá que el archivo existe.</div>';
      };
      document.head.appendChild(sc);
    }

    function initRunner() {
      if (!window.INTENT_TESTS) {
        document.getElementById('__tr-body').innerHTML =
          '<div style="padding:20px;color:#ef4444">window.INTENT_TESTS no definido.</div>';
        return;
      }

      const { SUITES, run } = window.INTENT_TESTS;

      // Botones de filtro de suites
      const filterEl = document.getElementById('__tr-filter');
      SUITES.forEach(s => {
        const b = document.createElement('button');
        b.className = 'sf on';
        b.dataset.name = s.name;
        b.textContent  = s.name.split('·')[0].trim();
        b.onclick = () => b.classList.toggle('on');
        filterEl.appendChild(b);
      });

      async function runSuites(filter) {
        const body = document.getElementById('__tr-body');
        body.innerHTML = '';
        document.getElementById('__tr-prog-bar').style.width = '0';

        const totalTests = (filter
          ? SUITES.filter(s=>filter.has(s.name))
          : SUITES
        ).reduce((a,s)=>a+s.tests.length, 0);

        let done = 0;

        const { results, total, pass, fail, ms } = await run(filter);

        // Render suites
        results.forEach(sr => {
          const suEl = document.createElement('div');
          suEl.className = 'su';

          const sFail = sr.tests.filter(t=>t.status==='fail').length;
          const sPass = sr.tests.filter(t=>t.status==='pass').length;
          suEl.innerHTML = `
<div class="su-h" onclick="this.parentElement.classList.toggle('col')">
  <span class="su-arr">▼</span>
  <span class="su-title">${sr.name}</span>
  <span class="su-stats">
    <span style="color:#22c55e">${sPass}✓</span>
    ${sFail ? `<span style="color:#ef4444"> ${sFail}✗</span>` : ''}
  </span>
</div>
<div class="su-rows"></div>`;

          const rows = suEl.querySelector('.su-rows');
          sr.tests.forEach(t => {
            const row = document.createElement('div');
            row.className = `tr ${t.status}`;
            row.innerHTML = `
<span class="ic">${t.status==='pass'?'✓':t.status==='fail'?'✗':'·'}</span>
<div>
  <div class="tr-desc">${t.desc}</div>
  ${t.err ? `<div class="tr-err">${t.err.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div>` : ''}
</div>`;
            rows.appendChild(row);
            done++;
            document.getElementById('__tr-prog-bar').style.width =
              `${Math.round(done/Math.max(totalTests,1)*100)}%`;
          });

          if (sFail === 0) suEl.classList.add('col');
          body.appendChild(suEl);
        });

        document.getElementById('__st-tot').textContent  = total;
        document.getElementById('__st-pass').textContent = pass;
        document.getElementById('__st-fail').textContent = fail;
        document.getElementById('__st-ms').textContent   = ms;
        document.getElementById('__tr-prog-bar').style.width = '100%';
      }

      document.getElementById('__tr-run-all').onclick = () => runSuites(null);

      document.getElementById('__tr-run-sel').onclick = () => {
        const active = new Set(
          [...document.querySelectorAll('.sf.on')].map(b => b.dataset.name)
        );
        runSuites(active.size ? active : null);
      };

      document.getElementById('__tr-only-fail').onclick = () => {
        document.querySelectorAll('.tr').forEach(r => {
          r.style.display = r.classList.contains('fail') ? '' : 'none';
        });
        document.querySelectorAll('.su').forEach(s => {
          s.classList.toggle('col', !s.querySelector('.tr.fail'));
        });
      };

      // Auto-correr al cargar
      runSuites(null);
    }

    // Esperar a que LAYERS y todos los módulos de intent estén listos
    if (window.__LAYERS_READY__ && window.INTENT) {
      mountRunner();
    } else {
      const checkReady = () => {
        if (window.__LAYERS_READY__ && window.INTENT) {
          mountRunner();
        } else {
          setTimeout(checkReady, 100);
        }
      };
      window.addEventListener('layers:ready', checkReady, { once: true });
      setTimeout(checkReady, 500);
    }
  })();
  </script>
